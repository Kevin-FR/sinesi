[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/sns-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Kevin-FR/sinesi"

[workspace.dependencies]
# Internal crates
sns-apps = { path = "crates/sns-apps" }
sns-bridge = { path = "crates/sns-bridge" }
sns-engine = { path = "crates/sns-engine" }
sns-filius-import = { path = "crates/sns-filius-import" }
sns-fonts = { path = "crates/sns-fonts" }
sns-html = { path = "crates/sns-html" }
sns-i18n = { path = "crates/sns-i18n" }
sns-missions = { path = "crates/sns-missions" }
sns-model = { path = "crates/sns-model" }
sns-project = { path = "crates/sns-project" }
sns-protocols = { path = "crates/sns-protocols" }
sns-render = { path = "crates/sns-render" }
sns-report = { path = "crates/sns-report" }
sns-settings = { path = "crates/sns-settings" }
sns-topology = { path = "crates/sns-topology" }
sns-trace = { path = "crates/sns-trace" }
sns-ui-egui = { path = "crates/sns-ui-egui" }
sns-vfs = { path = "crates/sns-vfs" }

# Model, formats and verification
base64 = "0.22"
jsonschema = { version = "0.46", default-features = false }
roxmltree = "=0.20.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

# Rendering and fonts
harfrust = "=0.12.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
resvg = { version = "=0.45.1", default-features = false }
skrifa = "=0.44.0"

# Native presentation (feature selection in consuming manifests)
eframe = { version = "=0.37.0", default-features = false }
egui = { version = "=0.37.0", default-features = false }
egui_extras = { version = "=0.37.0", default-features = false }
egui_kittest = { version = "=0.37.0", default-features = false }
pollster = "=0.4.0"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 2
